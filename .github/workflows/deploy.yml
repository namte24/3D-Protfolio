name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # ⚠️ Make sure your branch is named 'main'. If it's 'master', change this line.

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Project
        run: npm run build
        # This builds your site. 
        # result goes to 'dist' (Vite) or 'build' (CRA).

      - name: 📂 Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ⚠️ CHECK THIS:
          # If your local build makes a 'dist' folder, keep it as './dist/'
          # If it makes a 'build' folder, change it to './build/'
          local-dir: ./dist/    
          
          # This is where it goes on Hostinger. 
          # usually ./public_html/ for the main site.
          server-dir: ./public_html/